<style>
/* ===================== Shared tokens ===================== */
:root {
  --sp-purple: #591F82; --sp-purple-deep: #3B1259; --sp-purple-light: #6E2A9E; --sp-gold: #F9B200;
  --page: #EDF0F6; --surface: #FFFFFF; --ink: #1B2140; --ink-soft: #3A4166; --muted: #6A7194; --line: #E1E5EF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-si: "Noto Sans Sinhala", "Iskoola Pota", "Nirmala UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #14101C; font-family: var(--f-body); min-height: 100vh;
       display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }

/* ===================== Ad root ===================== */
.stage { position: relative; }
.ad {
  --accent: #591F82; --tint: #F4ECFA;
  --deep: color-mix(in srgb, var(--accent) 72%, #000);
  --light: color-mix(in srgb, var(--accent) 70%, #fff);
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  width: 1080px; height: 1350px; overflow: hidden; color: var(--ink);
}
.ad[data-format="SQ"] { height: 1080px; }
.ad[data-format="ST"] { height: 1920px; }
.ad-inner { position: absolute; inset: 0; padding: 72px; display: flex; flex-direction: column; }
.ad[data-format="ST"] .ad-inner { padding: 270px 200px 380px 150px; }

[lang="si"] { font-family: var(--f-si); line-height: 1.5; letter-spacing: normal; }

/* Brand bar */
.brand-bar { display: flex; align-items: center; gap: 18px; flex: none; }
.sp-logo { width: 72px; height: 72px; flex: none; display: block; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 36px; letter-spacing: -0.01em; }
.chip { margin-left: auto; padding: 10px 22px; border-radius: 99px; font-family: var(--f-display);
        font-weight: 700; font-size: 28px; white-space: nowrap; }
.chip:empty { display: none; }
.ad[data-format="ST"] .sp-logo { width: 64px; height: 64px; }
.ad[data-format="ST"] .brand-name { font-size: 32px; }

/* Offer: price chip, save badge, CTA */
.offer-bar { display: flex; align-items: center; gap: 20px; flex: none; flex-wrap: wrap; }
.price-chip { display: inline-flex; align-items: baseline; gap: 16px; padding: 14px 28px; border-radius: 20px;
              background: var(--sp-gold); color: var(--sp-purple-deep); font-family: var(--f-display); white-space: nowrap; }
.price { font-weight: 800; font-size: 56px; line-height: 1; }
.price-was { font-weight: 700; font-size: 30px; text-decoration: line-through; text-decoration-thickness: 3px; opacity: .65; }
.price:empty, .price-was:empty { display: none; }
.price-chip:has(.price:empty) { display: none; }
.save-badge { padding: 12px 20px; border-radius: 14px; font-family: var(--f-display); font-weight: 800; font-size: 30px; white-space: nowrap; }
.save-badge:empty { display: none; }
.cta { margin-left: auto; font-weight: 600; font-size: 30px; white-space: nowrap; }
.cta:empty { display: none; }

/* Mockup slots */
.mockup-slot { position: relative; }
.mockup-shadow { position: absolute; left: 50%; bottom: -16px; height: 44px; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(15,20,40,.40) 0%, rgba(15,20,40,0) 70%); filter: blur(6px); }
.mockup { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
  transform: translate(var(--mx,0px), var(--my,0px)) scale(var(--ms,1)) rotate(var(--mr,0deg)); transform-origin: center bottom;
  filter: drop-shadow(0 30px 40px rgba(15,20,40,.28)); }
.cover-wrap { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); transform-origin: center bottom; }
.cover-wrap.is-tilted { transform: translateX(-50%) perspective(1600px) rotateY(-18deg) rotateX(2deg); }
.cover-img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 4px 10px 10px 4px;
  box-shadow: inset 6px 0 10px rgba(0,0,0,.18), 24px 30px 50px -10px rgba(15,20,40,.35); }

/* CSS fallback cover (base 400x600, scaled by JS) */
.css-cover { position: absolute; left: 0; top: 0; width: 400px; height: 600px; transform-origin: 0 0; overflow: hidden;
  background: var(--c-accent); border-radius: 4px 10px 10px 4px;
  box-shadow: inset 7px 0 0 rgba(0,0,0,.14), 24px 30px 50px -10px rgba(15,20,40,.40); }
.css-cover .cc-glow { position: absolute; right: -120px; top: -110px; width: 360px; height: 360px; border-radius: 50%;
  background: color-mix(in srgb, var(--c-accent) 70%, #fff); opacity: .45; }
.css-cover .cc-bubble { position: absolute; left: 84px; top: 92px; width: 190px; height: 112px; border-radius: 30px; background: var(--c-tint); }
.css-cover .cc-bubble::after { content: ""; position: absolute; left: 34px; bottom: -26px; border: 16px solid transparent;
  border-top: 22px solid var(--c-tint); border-left-width: 6px; }
.css-cover .cc-dots { position: absolute; left: 124px; top: 140px; display: flex; gap: 22px; }
.css-cover .cc-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--c-accent); }
.css-cover .cc-dots i:nth-child(2) { opacity: .7; } .css-cover .cc-dots i:nth-child(3) { opacity: .45; }
.css-cover .cc-top { position: absolute; top: 24px; left: 26px; right: 26px; display: flex; justify-content: space-between;
  color: #fff; font: 600 13px var(--f-body); }
.css-cover .cc-badge { background: #fff; color: var(--c-accent); border-radius: 99px; padding: 2px 10px; font: 800 14px var(--f-display); }
.css-cover .cc-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: var(--c-tint);
  border-top-right-radius: 88px; padding: 30px 28px 22px; display: flex; flex-direction: column; }
.css-cover .cc-num { font: 700 15px var(--f-display); color: var(--c-accent); }
.css-cover .cc-si { margin-top: 6px; font: 700 38px/1.4 var(--f-si); color: color-mix(in srgb, var(--c-accent) 72%, #000); }
.css-cover .cc-en { margin-top: 6px; font: 700 19px/1.2 var(--f-display); color: color-mix(in srgb, var(--c-accent) 60%, #000); }
.css-cover .cc-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px;
  border-top: 1px solid color-mix(in srgb, var(--c-accent) 22%, transparent); font: 700 17px var(--f-display);
  color: color-mix(in srgb, var(--c-accent) 72%, #000); }
.css-cover .cc-foot svg { width: 30px; height: 30px; }

/* Preview controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.controls button, .controls select { padding: 8px 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,.22);
  background: transparent; color: #fff; font: 600 13px var(--f-body); cursor: pointer; }
.controls select option { color: #000; }
.controls button[aria-pressed="true"] { background: var(--sp-gold); color: var(--sp-purple-deep); border-color: var(--sp-gold); }
.controls .sep { width: 1px; height: 22px; background: rgba(255,255,255,.2); }

/* Render mode (Part 7.3) */
body.render { margin: 0; padding: 0; background: none; display: block; min-height: 0; }
body.render .controls { display: none; }
body.render .stage { width: auto; height: auto; }
body.render .ad { position: static; transform: none !important; }

/* ===================== Template ===================== */

.ad.s1 { background: radial-gradient(circle at 74% 62%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 46%), var(--tint); }
.s1 .brand-name { color: var(--deep); }
.s1 .chip { background: var(--surface); color: var(--accent); }
.s1 .chip.is-adult { background: var(--deep); color: #fff; }

.s1 .hook-block { margin-top: 64px; flex: none; }
.s1 .hook { margin: 0; font: 700 88px/1.42 var(--f-si); color: var(--deep); }
.s1 .hook:not([lang]) { font-family: var(--f-display); font-weight: 800; line-height: 1.04; letter-spacing: -0.03em; }
.s1 .hook-en { margin: 12px 0 0; font: 700 42px/1.2 var(--f-display); color: var(--accent); letter-spacing: -0.01em; }

.s1 .middle { flex: 1; min-height: 560px; display: flex; gap: 24px; margin: 36px 0 40px; }
.s1 .proof { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.s1 .stat-number { font: 800 140px/.92 var(--f-display); letter-spacing: -0.04em; white-space: nowrap; color: var(--accent); }
.s1 .stat-label { margin-top: 10px; font: 600 36px/1.2 var(--f-body); color: var(--ink-soft); }
.s1 .bullets { list-style: none; margin: 44px 0 0; padding: 0; display: grid; gap: 22px; }

  font: 600 32px/1.25 var(--f-body); color: var(--ink); }
.s1 .bullets li::before { content: ""; width: 44px; height: 44px; border-radius: 50%;

.s1 .mockup-slot { width: 520px; flex: none; }

.s1 .cta { color: var(--deep); }

.ad.s1[data-format="SQ"] .hook-block { margin-top: 44px; }
.ad.s1[data-format="SQ"] .hook { font-size: 70px; }
.ad.s1[data-format="SQ"] .hook-en { font-size: 36px; }
.ad.s1[data-format="SQ"] .middle { min-height: 400px; margin: 24px 0 28px; }
.ad.s1[data-format="SQ"] .mockup-slot { width: 480px; }
.ad.s1[data-format="SQ"] .stat-number { font-size: 128px; }
.ad.s1[data-format="SQ"] .bullets { display: none; }

/* ST (safe zone content box 730 x 1270) */
.ad.s1[data-format="ST"] .hook-block { margin-top: 48px; }
.ad.s1[data-format="ST"] .hook { font-size: 84px; }
.ad.s1[data-format="ST"] .middle { flex-direction: column; min-height: 640px; margin: 28px 0 32px; gap: 28px; }
.ad.s1[data-format="ST"] .mockup-slot { order: -1; width: 100%; flex: 1; }
.ad.s1[data-format="ST"] .proof { flex: none; flex-direction: row; align-items: baseline; justify-content: flex-start; gap: 20px; }
.ad.s1[data-format="ST"] .stat-number { font-size: 120px; }
.ad.s1[data-format="ST"] .stat-label { margin: 0; }
.ad.s1[data-format="ST"] .bullets { display: none; }
.ad.s1[data-format="ST"] .cta { margin-left: 0; width: 100%; }

</style>
</head>

/* ---------- Shared runtime ---------- */
const q = new URLSearchParams(location.search);
const RENDER = q.get("render") === "1";
if (RENDER) document.body.classList.add("render");
const FORMATS = { SQ: [1080, 1080], PT: [1080, 1350], ST: [1080, 1920] };
const AD = document.getElementById("ad");
let SHOW_MOCKUPS = q.get("mockups") !== "0";

for (const k in CONFIG) {
  if (!q.has(k)) continue;
  const v = q.get(k), cur = CONFIG[k];
  if (typeof cur === "number") CONFIG[k] = Number(v);
  else if (Array.isArray(cur) || (cur && typeof cur === "object")) {
    try { CONFIG[k] = JSON.parse(v); } catch (e) { if (Array.isArray(cur)) CONFIG[k] = v.split("|"); }
  } else CONFIG[k] = v;
}
if (!FORMATS[CONFIG.format]) CONFIG.format = "PT";

const byId = id => document.getElementById(id);
const hasSi = s => /[\u0D80-\u0DFF]/.test(s || "");
const bookOf = n => BOOKS[Math.min(10, Math.max(1, Number(n) || 1)) - 1];
function setText(id, value) {
  const el = byId(id); if (!el) return;
  el.textContent = value || "";
  if (hasSi(value)) el.setAttribute("lang", "si"); else el.removeAttribute("lang");
}
function setColors(accent, tint) {
  AD.style.setProperty("--accent", (CONFIG.colors && CONFIG.colors.accent) || accent);
  AD.style.setProperty("--tint", (CONFIG.colors && CONFIG.colors.tint) || tint);
}

const LOGO_PATH = "M87.787 36.736a20.05 20.05 0 0 0-14.263-5.912 20.05 20.05 0 0 0-14.264 5.912L36.034 59.962a12.59 12.59 0 0 1-8.962 3.707 12.55 12.55 0 0 1-8.952-3.717A12.53 12.53 0 0 1 14.404 51c0-3.378 1.314-6.56 3.716-8.962a12.58 12.58 0 0 1 8.952-3.707 12.58 12.58 0 0 1 8.962 3.707l5.463 5.464 4.961-.46.342-4.842-5.464-5.464a20.05 20.05 0 0 0-14.264-5.912 20.05 20.05 0 0 0-14.264 5.912C8.998 40.546 6.896 45.613 6.896 51s2.102 10.452 5.912 14.265a20.05 20.05 0 0 0 14.264 5.911 20.05 20.05 0 0 0 14.264-5.911l23.226-23.227a12.59 12.59 0 0 1 8.963-3.707c3.378 0 6.56 1.313 8.952 3.707 4.944 4.945 4.944 12.979 0 17.924a12.58 12.58 0 0 1-8.952 3.707 12.59 12.59 0 0 1-8.963-3.707L58.301 53.7l-.342 4.842-4.961.46-.045-.045v.001l6.308 6.307a20.05 20.05 0 0 0 14.264 5.911 20.05 20.05 0 0 0 14.263-5.911c7.862-7.866 7.862-20.665-.001-28.529";
function logoSVG(bg, fg, label) {
  return `<svg class="sp-logo" viewBox="0 0 300 300" ${label ? 'role="img" aria-label="StudyPal"' : 'aria-hidden="true"'}>` +
    `<rect width="300" height="300" rx="64" fill="${bg}"/>` +
    `<g fill="${fg}" transform="matrix(2.3512290156904005,0,0,2.3512290156904005,31.75624218697046,30.09)"><path d="${LOGO_PATH}"/></g></svg>`;
}

function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(false);
    const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = src;
  });
}

/* CSS-only cover, used when neither a mockup nor the flat cover PNG is available */
function cssCover(book) {
  const c = document.createElement("div");
  c.className = "css-cover";
  c.style.setProperty("--c-accent", book.accent);
  c.style.setProperty("--c-tint", book.tint);
  c.innerHTML = `<div class="cc-glow"></div><div class="cc-bubble"></div><div class="cc-dots"><i></i><i></i><i></i></div>
    <div class="cc-top"><span>The Ultimate Practical English Book</span><span class="cc-badge"></span></div>
    <div class="cc-panel"><div class="cc-num"></div><div class="cc-si" lang="si"></div><div class="cc-en"></div>
    <div class="cc-foot">${logoSVG(book.accent, book.tint)}<span>StudyPal</span></div></div>`;
  c.querySelector(".cc-num").textContent = "Book " + String(book.n).padStart(2, "0");
  c.querySelector(".cc-si").textContent = book.si;
  c.querySelector(".cc-en").textContent = book.en;
  const badge = c.querySelector(".cc-badge");
  if (book.n === 8) badge.textContent = "18+"; else badge.remove();
  return c;
}
function fitCoverTitle(c) {
  const si = c.querySelector(".cc-si"), panel = c.querySelector(".cc-panel");
  let s = 38; si.style.fontSize = s + "px";
  while (panel.scrollHeight > panel.clientHeight && s > 18) { s -= 1; si.style.fontSize = s + "px"; }
}

/* Fill a mockup slot: mockup image → flat cover PNG (CSS 3D) → CSS cover */
async function fillSlot(slot, { src = "", book, tilt = true, nudge = false, maxH = 1 } = {}) {
  slot.innerHTML = "";
  const W = slot.offsetWidth, H = slot.offsetHeight;
  const shadow = document.createElement("div");
  shadow.className = "mockup-shadow";
  slot.appendChild(shadow);
  if (SHOW_MOCKUPS && src && await loadImg(src)) {
    const img = new Image();
    img.className = "mockup"; img.alt = ""; img.src = src;
    if (nudge) {
      img.style.setProperty("--ms", CONFIG.mockupScale ?? 1);
      img.style.setProperty("--mx", (CONFIG.mockupX ?? 0) + "px");
      img.style.setProperty("--my", (CONFIG.mockupY ?? 0) + "px");
      img.style.setProperty("--mr", (CONFIG.mockupRotate ?? 0) + "deg");
    }
    shadow.style.width = W * 0.8 + "px";
    slot.appendChild(img);
    return;
  }
  const h = Math.min(H * maxH, W * 1.5), w = h * 2 / 3;
  shadow.style.width = w * 0.95 + "px";
  const wrap = document.createElement("div");
  wrap.className = "cover-wrap" + (tilt ? " is-tilted" : "");
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
  slot.appendChild(wrap);
  if (await loadImg(book.cover)) {
    const img = new Image(); img.className = "cover-img"; img.alt = ""; img.src = book.cover;
    wrap.appendChild(img);
  } else {
    const c = cssCover(book);
    c.style.transform = `scale(${w / 400})`;
    wrap.appendChild(c);
    fitCoverTitle(c);
  }
}

/* Shrink-to-fit (Part 7.5): lower [data-fit] font sizes in 2px steps until the ad's content fits */
function fitText() {
  const inner = AD.querySelector(".ad-inner");
  const els = [...AD.querySelectorAll("[data-fit]")].filter(e => e.offsetParent !== null);
  els.forEach(e => e.style.fontSize = "");
  const base = els.map(e => parseFloat(getComputedStyle(e).fontSize));
  const min = els.map(e => Number(e.dataset.min || 28));
  const tallOver = () => inner.scrollHeight > inner.clientHeight + 1;
  const ownOver = e => e.scrollWidth > e.clientWidth + 1 || (e.dataset.box && e.scrollHeight > e.clientHeight + 1);
  for (let step = 0; step < 120; step++) {
    const tall = tallOver();
    let moved = false;
    els.forEach((e, i) => {
      if (!tall && !ownOver(e)) return;          // width problems shrink only that element
      const cur = parseFloat(e.style.fontSize || base[i]);
      if (cur - 2 >= min[i]) { e.style.fontSize = (cur - 2) + "px"; moved = true; }
    });
    if (!moved) break;
  }
}

function layoutStage() {
  const [W, H] = FORMATS[CONFIG.format];
  if (RENDER) { AD.style.transform = "none"; return; }
  const s = Math.min((innerWidth - 32) / W, (innerHeight - 110) / H, 1);
  const st = document.querySelector(".stage");
  st.style.width = W * s + "px"; st.style.height = H * s + "px";
  AD.style.transform = `scale(${s})`;
}

function buildControls(extra) {
  const bar = byId("controls");
  const fmt = ["SQ", "PT", "ST"].map(f => `<button type="button" data-fmt="${f}">${f}</button>`).join("");
  bar.innerHTML = fmt + '<span class="sep"></span>' + (extra || "") +
    '<button type="button" id="mockToggle">Mockups</button>';
  bar.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => { CONFIG.format = b.dataset.fmt; run(); });
  byId("mockToggle").onclick = () => { SHOW_MOCKUPS = !SHOW_MOCKUPS; run(); };
}
function syncControls() {
  document.querySelectorAll("[data-fmt]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === CONFIG.format));
  const t = byId("mockToggle"); if (t) t.setAttribute("aria-pressed", SHOW_MOCKUPS);
}

async function run() {
  AD.dataset.format = CONFIG.format;
  populate();
  fitText();
  await fillSlots();
  layoutStage();
  syncControls();
}
addEventListener("resize", layoutStage);

  const src = (CONFIG.mockup || "").replace(/b\d\d-/, "b" + String(b.n).padStart(2, "0") + "-");
